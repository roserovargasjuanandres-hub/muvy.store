<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9A4430">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css?v=2">
  <title>Carrito · MUVY</title>
  <meta name="robots" content="noindex">
</head>
<body data-page="cart">
  <div id="header"></div>
  <main class="wrap">
    <div class="page-head"><span class="eyebrow">TU PEDIDO</span><h1 class="page-title">Carrito</h1></div>
    <div class="cart-layout" id="cart-layout">
      <div id="cart-items"></div>
      <aside class="summary">
        <h2>Resumen</h2>
        <div class="row"><span>Subtotal</span><span id="subtotal"></span></div>
        <div class="row"><span>Envío</span><span id="shipping"></span></div>
        <div class="row total"><span>Total a pagar al recibir</span><span id="total"></span></div>
        <form class="form" id="checkout">
          <div><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" required autocomplete="name"></div>
          <div><label for="telefono">Celular</label><input id="telefono" name="telefono" type="tel" required autocomplete="tel" inputmode="tel" placeholder="3001234567"></div>
          <div><label for="departamento">Departamento</label><select id="departamento" name="departamento" required></select></div>
          <div><label for="ciudad">Ciudad o municipio</label><input id="ciudad" name="ciudad" required autocomplete="address-level2"></div>
          <div><label for="direccion">Dirección y barrio</label><input id="direccion" name="direccion" required autocomplete="street-address"></div>
          <div><label for="email">Correo (opcional)</label><input id="email" name="email" type="email" autocomplete="email"></div>
          <div><label for="notas">Notas para la entrega (opcional)</label><textarea id="notas" name="notas" rows="2"></textarea></div>
          <div class="hp" aria-hidden="true"><label for="website">No llenar</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
          <p class="form-msg" id="form-msg" role="alert"></p>
          <button class="btn btn-primary btn-block" type="submit">Confirmar pedido · Pago al recibir</button>
        </form>
        <p class="note">Pagas en efectivo cuando recibes tu pedido. Te llamamos antes de despachar.</p>
      </aside>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/assets/config.js"></script>
  <script src="/assets/art.js?v=2"></script>
  <script src="/assets/content.js?v=3"></script>
  <script src="/assets/app.js?v=3"></script>
</body>
</html>
