<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9A4430">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css?v=7">
  <title>Catálogo · MUVY</title>
  <meta name="description" content="Todos los productos para el hogar de MUVY, con pago contraentrega.">
</head>
<body data-page="catalog">
  <div id="header"></div>
  <main class="wrap">
    <div class="page-head"><span class="eyebrow">CATÁLOGO</span><h1 class="page-title">Todo para tu casa</h1></div>
    <div class="chips" id="filters"></div>
    <div class="toolbar">
      <span id="count" style="color:var(--muted);font-size:13px;font-weight:600"></span>
      <label class="sr-only" for="search">Buscar productos</label>
      <input class="search" id="search" type="search" placeholder="Buscar productos…">
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No hay productos que coincidan con tu búsqueda.</p>
  </main>
  <div id="footer"></div>
  <script src="/assets/config.js?v=4"></script>
  <script src="/assets/art.js?v=4"></script>
  <script src="/assets/content.js?v=3"></script>
  <script src="/assets/app.js?v=6"></script>
</body>
</html>
