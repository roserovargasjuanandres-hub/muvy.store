<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · MUVY</title>
  <meta name="description" content="Todos los productos para el hogar de MUVY.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="catalog">
  <div id="header"></div>

  <main class="wrap">
    <div class="page-head">
      <div class="eyebrow">Catálogo</div>
      <h1 class="page-title">Todo para tu casa</h1>
    </div>
    <div class="toolbar">
      <div class="filters" id="filters"></div>
    </div>
    <div class="toolbar" style="margin-bottom:24px">
      <span id="count" style="color:var(--muted);font-size:.9rem"></span>
      <input class="search" id="search" type="search" placeholder="Buscar productos…" aria-label="Buscar productos">
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No hay productos que coincidan con tu búsqueda.</p>
    <div style="height:60px"></div>
  </main>

  <div id="footer"></div>
  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
