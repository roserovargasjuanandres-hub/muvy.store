name: Radar de mercado

on:
  schedule:
    # Cada 6 horas (hora Colombia: 1 a. m., 7 a. m., 1 p. m., 7 p. m.)
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: # botón "Run workflow" para correrlo cuando quieras

permissions:
  contents: write

concurrency:
  group: radar-mercado
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORREO_USUARIO: ${{ secrets.CORREO_USUARIO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revisar mercado
        id: radar
        env:
          DROPI_TOKEN: ${{ secrets.DROPI_TOKEN }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node bot/mercado/index.js

      - name: Avisar por correo si el mercado cambió
        if: steps.radar.outputs.enviar_correo == 'true' && env.CORREO_USUARIO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.CORREO_USUARIO }}
          password: ${{ secrets.CORREO_CLAVE }}
          from: Radar MUVY <${{ secrets.CORREO_USUARIO }}>
          to: ${{ secrets.CORREO_DESTINO || secrets.CORREO_USUARIO }}
          subject: ${{ steps.radar.outputs.asunto }}
          html_body: file://${{ runner.temp }}/correo.md
          convert_markdown: true

      - name: Guardar reporte en el repositorio
        if: always()
        run: |
          git config user.name "radar-muvy[bot]"
          git config user.email "radar-muvy@users.noreply.github.com"
          git add bot/mercado/reportes
          git diff --cached --quiet && exit 0
          git commit -m "Radar de mercado $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
